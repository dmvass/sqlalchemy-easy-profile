[tool.poetry]
name = "sqlalchemy-easy-profile"
version = "1.3.0"
description = "An easy profiler for SQLAlchemy queries"
authors = ["Dmytro Vasylyshyn <dmvass.dev@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dmvass/sqlalchemy-easy-profile"
repository = "https://github.com/dmvass/sqlalchemy-easy-profile"
keywords = ["sqlalchemy", "easy", "profile", "profiler", "profiling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

packages = [
  { include = "easy_profile" }
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
sqlalchemy = "<2.1"
sqlparse = ">=0.3.0"

[tool.poetry.group.dev.dependencies]
coverage = "*"
flake8 = "^7.3.0"
flake8-import-order = "^0.19.2"
flake8-quotes = "^3.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
